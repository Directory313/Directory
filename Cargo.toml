[workspace]
resolver = "2"
members = [
    "crates/veyra-core",
    "crates/veyra-media",
    "crates/veyra-render",
    "crates/veyra-export",
]

[workspace.package]
version = "0.9.0-beta"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
rayon = "1"
glam = { version = "0.30", features = ["serde"] }

# Keep the build small: this machine has limited disk. No debug info in dev builds,
# but optimise heavy dependencies (wgpu, image codecs) so debug builds stay usable.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
