# Builds the Windows installer on GitHub's computers, so no build files are needed locally.
#
#  - Push a version tag (e.g. v0.9.2)  -> builds and publishes a GitHub Release with the installer.
#  - "Run workflow" on the Actions tab -> test build; the installer is attached to the run
#    (Actions -> the run -> "Artifacts") and kept for 7 days. Nothing is published.
#
# Before tagging a new version, bump "version" in src-tauri/tauri.conf.json to match the tag.
name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $ver in src-tauri/tauri.conf.json"
          }

      # The same FFmpeg build that ships today (gyan.dev full build, GPL). The exe files are
      # not stored in the repository because they are large.
      - name: Fetch FFmpeg
        run: |
          $ver = '9.1'
          $dst = 'src-tauri/resources/ffmpeg'
          $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          try {
            Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$ver/ffmpeg-$ver-full_build.zip" -OutFile "$tmp/ff.zip"
            Expand-Archive "$tmp/ff.zip" $tmp
          } catch {
            Write-Host "Pinned build not found ($_); using gyan.dev's current release build."
            Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z' -OutFile "$tmp/ff.7z"
            7z x "$tmp/ff.7z" "-o$tmp" | Out-Null
          }
          $bin = Get-ChildItem $tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName 'ffprobe.exe') $dst
          & "$dst/ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Build interface
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Build installer
        run: ui/node_modules/.bin/tauri build --bundles nsis

      - name: Find installer
        id: out
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "$($exe.Name): $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Keep test build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: ${{ steps.out.outputs.path }}
          retention-days: 7
          compression-level: 0

      - name: Publish release (version tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "${{ steps.out.outputs.path }}" --clobber
          } else {
            $notes = "Directory $($tag.TrimStart('v')) Beta for Windows (64-bit).`n`nDownload **${{ steps.out.outputs.name }}** below and run it to install."
            gh release create $tag "${{ steps.out.outputs.path }}" --title "Directory $($tag.TrimStart('v')) Beta" --notes $notes
          }
