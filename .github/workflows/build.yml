# Builds the Windows installer on GitHub's computers, so no build files are needed locally.
#
#  - Push a version tag (e.g. v0.9.2)  -> builds and publishes a GitHub Release with the installer.
#  - "Run workflow" on the Actions tab -> test build; the installer is attached to the run
#    (Actions -> the run -> "Artifacts") and kept for 7 days. Nothing is published.
#
# Releasing: run scripts/bump-version.ps1 <version>, write what changed in RELEASE_NOTES.md (shown
# in the app's update pop-up and on the release page), commit, then push the tag v<version>.
# Every build is signed with the update key from the repository secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $ver in src-tauri/tauri.conf.json"
          }

      # The same FFmpeg build that ships today (gyan.dev full build, GPL). The exe files are
      # not stored in the repository because they are large.
      - name: Fetch FFmpeg
        run: |
          $ver = '9.1'
          $dst = 'src-tauri/resources/ffmpeg'
          $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          try {
            Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$ver/ffmpeg-$ver-full_build.zip" -OutFile "$tmp/ff.zip"
            Expand-Archive "$tmp/ff.zip" $tmp
          } catch {
            Write-Host "Pinned build not found ($_); using gyan.dev's current release build."
            Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z' -OutFile "$tmp/ff.7z"
            7z x "$tmp/ff.7z" "-o$tmp" | Out-Null
          }
          $bin = Get-ChildItem $tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName 'ffprobe.exe') $dst
          & "$dst/ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Build interface
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      # Signs the installer with the update key (repository secrets) so installed copies of
      # Directory accept it as an update. tauri.updater.conf.json turns on the .sig output.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Repository secret TAURI_SIGNING_PRIVATE_KEY is missing (Settings -> Secrets and variables -> Actions).' }
          ui/node_modules/.bin/tauri build --bundles nsis --config src-tauri/tauri.updater.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

      # latest.json is what installed copies download to learn about a new version. The app reads
      # it from .../releases/latest/download/latest.json, i.e. from the newest published release.
      - name: Prepare update files
        id: out
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw "Update signature $sig was not created" }
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          $notes = if (Test-Path RELEASE_NOTES.md) { (Get-Content RELEASE_NOTES.md -Raw).Trim() } else { '' }
          $dir = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $exe.FullName, $sig $dir
          [ordered]@{
            version   = $ver
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sig -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $dir 'latest.json') -Encoding utf8NoBOM
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "$($exe.Name): $([math]::Round($exe.Length / 1MB, 1)) MB, signed"
          Get-Content (Join-Path $dir 'latest.json')

      - name: Keep test build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: ${{ steps.out.outputs.dir }}
          retention-days: 7
          compression-level: 0

      - name: Publish release (version tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $dir = '${{ steps.out.outputs.dir }}'
          $files = @("$dir/${{ steps.out.outputs.name }}", "$dir/${{ steps.out.outputs.name }}.sig", "$dir/latest.json")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            $intro = "Directory $($tag.TrimStart('v')) Beta for Windows (64-bit).`n`nAlready have Directory 0.9.2 or later? It offers this update by itself. Otherwise download **${{ steps.out.outputs.name }}** below and run it to install."
            $notes = if (Test-Path RELEASE_NOTES.md) { "$intro`n`n## What's new`n`n$((Get-Content RELEASE_NOTES.md -Raw).Trim())" } else { $intro }
            gh release create $tag @files --title "Directory $($tag.TrimStart('v')) Beta" --notes $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'publishing the release failed' }
